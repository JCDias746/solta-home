  const cstep=()=>sw()+GAP, coff=()=>(car.clientWidth-sw())/2;
  cXfor=i=>coff()-i*cstep();
  renderCar=anim=>{ cTrack.style.transition=anim?'':'none'; cTrack.style.transform=`translateX(${cXfor(h)}px)`;
    cSlides.forEach((s,i)=>s.classList.toggle('active',i===h)); cDots.forEach((d,i)=>d.classList.toggle('on',i===h)); };

function renderAll(anim){ renderDeck(anim); renderCar(anim); }
requestAnimationFrame(()=>renderAll(false));

/* one gesture handler: vertical swipe = page, horizontal swipe (in carousel) = slide */

let wl=false;
app.addEventListener('wheel',e=>{ e.preventDefault(); if(wl||Math.abs(e.deltaY)<16)return; wl=true;
  if(e.deltaY>0)v=Math.min(N-1,v+1); else v=Math.max(0,v-1); renderDeck(true); setTimeout(()=>wl=false,640); },{passive:false});
// swallow the click that ends a swipe (so a drag doesn't open a link)
app.addEventListener('click',e=>{ if(Math.abs(mdx)>8||Math.abs(mdy)>8){ e.preventDefault(); e.stopPropagation(); } }, true);

// hamburger menu (items link to the real Solta store)
const menuWrap=document.getElementById('menuWrap');
hambBtn.addEventListener('click',()=>menuWrap.classList.add('open'));
document.getElementById('menuClose').addEventListener('click',()=>menuWrap.classList.remove('open'));
document.querySelector('[data-home]').addEventListener('click',e=>{ e.preventDefault(); menuWrap.classList.remove('open'); v=0; renderDeck(true); });

// real cart count: reads the Shopify cart via a same-origin /cart.js.
// On the live Solta domain this returns the real item count; on the preview domain it just stays hidden.
const cartBadge=document.getElementById('cartBadge');
function refreshCart(){
  fetch('/cart.js',{headers:{'Accept':'application/json'},credentials:'same-origin'})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ const n=(d&&d.item_count)||0; cartBadge.textContent=n>99?'99+':n; cartBadge.classList.toggle('show',n>0); })
    .catch(()=>{});
}
refreshCart();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshCart(); });
window.addEventListener('pageshow',refreshCart);
</script>
