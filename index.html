<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Solta · Brazilian Lingerie</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#0d0a08}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .app{max-width:460px;margin:0 auto;height:100dvh;overflow-y:scroll;background:#0d0a08;
    scroll-snap-type:y proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;box-shadow:0 0 60px rgba(0,0,0,.35)}
  .app::-webkit-scrollbar{display:none}
  .card{min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;
    scroll-snap-align:start;overflow:hidden}
  .wrap{position:relative;width:100%;display:block}
  .wrap img{width:100%;height:auto;display:block}
  .area{position:absolute;display:block}
  a.wrap::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .2s}
  a.wrap:active::after{background:rgba(0,0,0,.05)}
  .area:active{background:rgba(0,0,0,.05)}

  /* horizontal carousel card */
  .card.compact{min-height:auto;padding:9vh 0;flex-direction:column}
  .carwrap{width:100%}
  .carousel{position:relative;width:100%;overflow:hidden}
  .track{display:flex;align-items:center;gap:14px;will-change:transform;touch-action:pan-y;
    transition:transform .52s cubic-bezier(.22,1,.36,1)}
  .track.dragging{transition:none}
  .slide{flex:0 0 84%;display:block;border-radius:16px;overflow:hidden;
    box-shadow:0 18px 44px rgba(0,0,0,.45);transition:opacity .4s,transform .5s cubic-bezier(.22,1,.36,1);
    opacity:.5;transform:scale(.94)}
  .slide.active{opacity:1;transform:scale(1)}
  .slide img{width:100%;height:auto;display:block;pointer-events:none}
  .dots{display:flex;gap:7px;justify-content:center;margin-top:22px}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.32);transition:.3s}
  .dot.on{background:#fff;width:22px;border-radius:4px}

  /* site footer */
  .sitefooter{scroll-snap-align:start;min-height:100dvh;background:#f5f0e7;color:#2f2119;
    padding:74px 30px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .sitefooter .flogo{height:26px;opacity:.95}
  .sitefooter .fabout{margin-top:18px;max-width:300px;font-size:14px;line-height:1.6;color:#7a6a5d;font-weight:300}
  .sitefooter .fcols{display:grid;grid-template-columns:1fr 1fr;gap:32px 20px;margin:42px 0 8px}
  .sitefooter h4{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#a15f35;font-weight:600;margin-bottom:14px}
  .sitefooter .fcol a{display:block;color:#40302a;text-decoration:none;font-size:14px;font-weight:300;padding:6px 0}
  .sitefooter .fcol a:active{color:#a15f35}
  .sitefooter .fcontact{margin-top:32px;padding-top:24px;border-top:1px solid rgba(60,40,28,.14);
    display:flex;align-items:center;justify-content:space-between;gap:16px}
  .sitefooter .fmail{color:#2f2119;text-decoration:none;font-size:14px;border-bottom:1px solid rgba(161,95,53,.55);padding-bottom:3px}
  .sitefooter .fsocial{display:flex;gap:16px}
  .sitefooter .fsocial a{color:#5a4a3f}
  .sitefooter .fsocial svg{width:22px;height:22px;display:block}
  .sitefooter .fbar{margin-top:auto;padding-top:32px;font-size:11.5px;letter-spacing:.04em;color:#9a8b7d}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const SHOP='https://soltalingerie.com/collections/';
// Each card is a designed full-width image.
//  - single link:  { img, bg, href }
//  - clickable map: { img, bg, areas:[{href, style}] }  (style in % over the image)
const cards = [
  { img:'img/card-hero.png', bg:'#0d0a08', href:SHOP+'all-sets' },

  { img:'img/card-categories.png', bg:'#f5f0ed', areas:[
      { href:SHOP+'bras',      style:'top:22%;left:0;width:50%;height:36%' },   // Bras (top-left)
      { href:SHOP+'knickers',  style:'top:22%;left:50%;width:50%;height:36%' },  // Knickers (top-right)
      { href:SHOP+'all-sets',  style:'top:58%;left:0;width:50%;height:40%' },    // Sets (bottom-left)
      { href:SHOP+'babydolls', style:'top:58%;left:50%;width:50%;height:40%' },  // Nightwear (bottom-right)
  ]},

  { bg:'#0d0a08', carousel:[
      { img:'img/carousel-jasmine.png', href:'https://soltalingerie.com/products/the-solta-whisper-set-jasmite' },
      { img:'img/carousel-nova.png',    href:'https://soltalingerie.com/products/the-solta-whisper-set-nova' },
      { img:'img/carousel-serena.png',  href:'https://soltalingerie.com/products/the-solta-harmony-set-serena?variant=52590354628872' },
      { img:'img/carousel-mia.png',     href:'https://soltalingerie.com/products/the-solta-harmony-set-mia' },
  ]},

  { img:'img/card-story.png', bg:'#0d0a08', href:'https://soltalingerie.com/pages/our-story' },

  { img:'img/card-feel.png', bg:'#0d0a08', href:'https://soltalingerie.com/collections/all-sets' },

  { img:'img/card-dual.png', bg:'#f5f0ed', areas:[
      { href:'https://soltalingerie.com/products/babydoll-paloma',          style:'top:0;left:0;width:100%;height:50%' },   // top (Everyday elegance) -> Paloma
      { href:'https://soltalingerie.com/products/the-solta-harmony-set-willow', style:'top:50%;left:0;width:100%;height:42%' }, // bottom (After dark) -> Willow
  ]},
];

document.getElementById('app').innerHTML = cards.map((c,i)=>{
  const lazy = i>0 ? 'loading="lazy"' : '';
  if(c.carousel){
    const slides = c.carousel.map((s,k)=>`<a class="slide${k===0?' active':''}" href="${s.href}" aria-label="Shop"><img src="${s.img}" ${lazy} alt="Solta"></a>`).join('');
    const dots = c.carousel.map((_,j)=>`<span class="dot ${j===0?'on':''}"></span>`).join('');
    return `<div class="card compact" style="background:${c.bg}"><div class="carwrap"><div class="carousel"><div class="track">${slides}</div></div><div class="dots">${dots}</div></div></div>`;
  }
  const inner = c.areas
    ? `<div class="wrap"><img src="${c.img}" ${lazy} alt="Solta">`
        + c.areas.map(a=>`<a class="area" style="${a.style}" href="${a.href}" aria-label="Shop"></a>`).join('')
        + `</div>`
    : `<a class="wrap" href="${c.href}" aria-label="Shop the collection"><img src="${c.img}" ${lazy} alt="Solta"></a>`;
  return `<div class="card" style="background:${c.bg}">${inner}</div>`;
}).join('');

// complete footer
const S='https://soltalingerie.com';
document.getElementById('app').insertAdjacentHTML('beforeend', `
  <footer class="sitefooter">
    <p class="fabout">Brazilian lingerie, designed and made in Brazil. Delivered across the UK.</p>
    <div class="fcols">
      <div class="fcol"><h4>Lingerie Guide</h4>
        <a href="${S}/pages/size-guide">Size Guide</a>
        <a href="${S}/blogs/solta-tips-and-secrets/lingerie-care-tips">Care Tips</a></div>
      <div class="fcol"><h4>Support</h4>
        <a href="${S}/pages/contact">Contact</a>
        <a href="${S}/pages/faq">FAQ</a>
        <a href="${S}/pages/shipping-delivery">Shipping &amp; Delivery</a>
        <a href="${S}/pages/returns-exchanges-uk-only">Returns &amp; Exchanges</a></div>
      <div class="fcol"><h4>Company</h4>
        <a href="${S}/pages/our-story">Our Story</a>
        <a href="${S}/pages/terms-and-conditions">Terms &amp; Conditions</a>
        <a href="${S}/pages/privacy-policy">Privacy Policy</a></div>
      <div class="fcol"><h4>Affiliates</h4>
        <a href="https://affiliate.soltalingerie.com">Affiliate Program</a>
        <a href="${S}/pages/affiliate-faq">Affiliate FAQ</a></div>
    </div>
    <div class="fcontact">
      <a class="fmail" href="mailto:love@soltalingerie.com">love@soltalingerie.com</a>
      <div class="fsocial">
        <a href="https://www.instagram.com/soltalingerie/" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
        <a href="https://www.tiktok.com/@soltalingerie" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 3c.3 2 1.6 3.6 3.6 3.9V9.6c-1.4 0-2.7-.4-3.6-1.1v6.1c0 3-2.4 5.4-5.4 5.4S5.2 17.6 5.2 14.6 7.6 9.2 10.6 9.2c.3 0 .6 0 .9.1v2.7c-.3-.1-.6-.2-.9-.2-1.4 0-2.6 1.2-2.6 2.7s1.2 2.7 2.6 2.7 2.7-1.2 2.7-2.7V3H16z"/></svg></a>
        <a href="https://www.facebook.com/profile.php?id=61581930364188" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8.5V7c0-.8.5-1 1-1h1.5V3H14c-2.2 0-3.5 1.4-3.5 3.6v1.9H8V11h2.5v9h3v-9H16l.5-2.5H14z"/></svg></a>
      </div>
    </div>
    <div class="fbar">© 2025 Solta Lingerie · Made in Brazil</div>
  </footer>
`);

// JS carousel: swipe advances exactly one card and eases perfectly into place (touch + mouse)
document.querySelectorAll('.carousel').forEach(car=>{
  const track=car.querySelector('.track');
  const slides=[...track.children];
  const n=slides.length;
  const dots=[...car.parentElement.querySelectorAll('.dot')];
  const GAP=14;
  let index=0, startX=0, startY=0, dragging=false, decided=false, horizontal=false, baseX=0, moved=0;

  const slideW=()=>slides[0].getBoundingClientRect().width;
  const step=()=>slideW()+GAP;
  const centerOffset=()=>(car.clientWidth - slideW())/2;
  const xFor=i=>centerOffset() - i*step();

  function render(anim){
    track.style.transition = anim ? '' : 'none';
    track.style.transform = `translateX(${xFor(index)}px)`;
    slides.forEach((s,i)=>s.classList.toggle('active', i===index));
    dots.forEach((d,i)=>d.classList.toggle('on', i===index));
  }
  requestAnimationFrame(()=>render(false));
  addEventListener('resize', ()=>render(false));

  function onStart(x,y){ dragging=true; decided=false; horizontal=false; moved=0;
    startX=x; startY=y; baseX=xFor(index); track.classList.add('dragging'); }
  function onMove(x,y,ev){
    if(!dragging) return;
    const mx=x-startX, my=y-startY;
    if(!decided && (Math.abs(mx)>7 || Math.abs(my)>7)){ decided=true; horizontal=Math.abs(mx)>Math.abs(my); }
    if(horizontal){
      if(ev && ev.cancelable) ev.preventDefault();
      moved=mx;
      let px=baseX+mx; const maxX=xFor(0), minX=xFor(n-1);
      if(px>maxX) px=maxX+(px-maxX)*0.35;
      if(px<minX) px=minX+(px-minX)*0.35;
      track.style.transform=`translateX(${px}px)`;
    }
  }
  function onEnd(){
    if(!dragging) return; dragging=false; track.classList.remove('dragging');
    if(horizontal){
      const th=car.clientWidth*0.12;
      if(moved<=-th) index=Math.min(n-1,index+1);
      else if(moved>=th) index=Math.max(0,index-1);
      render(true);
    }
  }
  // touch (mobile)
  track.addEventListener('touchstart', e=>onStart(e.touches[0].clientX,e.touches[0].clientY), {passive:true});
  track.addEventListener('touchmove',  e=>onMove(e.touches[0].clientX,e.touches[0].clientY,e), {passive:false});
  track.addEventListener('touchend',   onEnd);
  track.addEventListener('touchcancel',onEnd);
  // mouse (desktop)
  track.addEventListener('mousedown', e=>{ e.preventDefault(); onStart(e.clientX,e.clientY); });
  window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY,e));
  window.addEventListener('mouseup', onEnd);
  // block navigation if the gesture was a swipe
  slides.forEach(s=>s.addEventListener('click', e=>{ if(Math.abs(moved)>8) e.preventDefault(); }));
});
</script>
</body>
</html>
